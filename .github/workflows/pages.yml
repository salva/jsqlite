name: Documentation and live demo
on:
  push:
    branches: [public-site]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/package/build-site.py
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/jsqlite-site-tests" --no-audit --no-fund playwright@1.60.0
          "$RUNNER_TEMP/jsqlite-site-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Validate actual browser playground
        run: JSQLITE_PLAYWRIGHT="$RUNNER_TEMP/jsqlite-site-tests/node_modules/playwright/index.mjs" node test/browser/public-site.test.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
